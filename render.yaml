# Review this Blueprint before syncing: its worker is a paid Render service.
# The existing rimiam-db database is referenced, not recreated.
envVarGroups:
  - name: rimiam-runtime
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: LOCAL_MAIL
        value: "false"

services:
  - type: web
    name: rimiam-chat-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - fromGroup: rimiam-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: rimiam-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: rimiam-chat-web
          envVarKey: RENDER_EXTERNAL_URL
  - type: worker
    name: rimiam-chat-worker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/scripts/render-worker.sh
    envVars:
      - fromGroup: rimiam-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: rimiam-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: rimiam-chat-web
          envVarKey: RENDER_EXTERNAL_URL
